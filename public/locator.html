<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Ubicación - Taller de Carrocería y Pintura Nogales</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0a0a0a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        overflow: hidden;
      }

      #container {
        width: 100%;
        height: 100%;
        position: relative;
      }

      gmpx-store-locator {
        width: 100%;
        height: 100%;

        /* These parameters customize the appearance of Locator Plus. See the documentation at
           https://github.com/googlemaps/extended-component-library/blob/main/src/store_locator/README.md
           for more information. */
        --gmpx-color-surface: #18181b;
        --gmpx-color-on-surface: #f4f4f5;
        --gmpx-color-on-surface-variant: #a1a1aa;
        --gmpx-color-primary: #f59e0b;
        --gmpx-color-outline: #27272a;
        --gmpx-fixed-panel-width-row-layout: 22em;
        --gmpx-fixed-panel-height-column-layout: 50%;
        --gmpx-font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --gmpx-font-family-headings: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --gmpx-font-size-base: 0.875rem;
        --gmpx-hours-color-open: #22c55e;
        --gmpx-hours-color-closed: #ef4444;
        --gmpx-rating-color: #f59e0b;
        --gmpx-rating-color-empty: #3f3f46;
      }

      #fallback-map {
        display: none;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        background-color: #121212;
      }

      #fallback-map.active {
        display: flex;
        flex-direction: column;
      }

      .map-frame {
        flex: 1;
        width: 100%;
        border: 0;
      }

      .fallback-header {
        background: #18181b;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #27272a;
      }

      .fallback-title {
        font-weight: 700;
        font-size: 13px;
        color: #fff;
      }

      .fallback-address {
        font-size: 11px;
        color: #a1a1aa;
      }

      .fallback-btn {
        background: #f59e0b;
        color: #000;
        font-weight: 700;
        font-size: 11px;
        padding: 6px 12px;
        border-radius: 6px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
    </style>
    <script>
      const CONFIGURATION = {
        "locations": [
          {
            "title": "Taller de Carrocería y Pintura",
            "address1": "José Zazueta 16",
            "address2": "Nogales, Son., Mexico",
            "coords": { "lat": 31.2988874, "lng": -110.9549794 },
            "placeId": "ChIJ7b8QWwBT0YYRpcZTL6tPJz8"
          }
        ],
        "mapOptions": {
          "center": { "lat": 31.2988874, "lng": -110.9549794 },
          "fullscreenControl": true,
          "mapTypeControl": false,
          "streetViewControl": true,
          "zoom": 16,
          "zoomControl": true,
          "maxZoom": 18,
          "mapId": ""
        },
        "mapsApiKey": "AIzaSyCFAGXW5oQcyTCR8HYW8PfBEUop_1nqpf0",
        "capabilities": {
          "input": true,
          "autocomplete": true,
          "directions": false,
          "distanceMatrix": true,
          "details": false,
          "actions": false
        }
      };

      let locatorConfigured = false;

      async function initLocator() {
        try {
          if (window.customElements) {
            await customElements.whenDefined('gmpx-store-locator');
            const locator = document.querySelector('gmpx-store-locator');
            if (locator) {
              locator.configureFromQuickBuilder(CONFIGURATION);
              locatorConfigured = true;
            }
          }
        } catch (e) {
          console.warn("Extended Component Library error, activating standard map view:", e);
          activateFallback();
        }
      }

      function activateFallback() {
        const fallback = document.getElementById('fallback-map');
        if (fallback) {
          fallback.classList.add('active');
        }
      }

      // Check after 2.5s if locator is visible and working
      setTimeout(() => {
        const locator = document.querySelector('gmpx-store-locator');
        if (!locator || !locator.shadowRoot || locator.offsetHeight === 0) {
          if (!locatorConfigured) {
            activateFallback();
          }
        }
      }, 2500);

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initLocator);
      } else {
        initLocator();
      }
    </script>
  </head>
  <body>
    <div id="container">
      <script type="module" src="https://ajax.googleapis.com/ajax/libs/@googlemaps/extended-component-library/0.6.15/index.min.js"></script>
      <gmpx-api-loader key="AIzaSyCFAGXW5oQcyTCR8HYW8PfBEUop_1nqpf0" solution-channel="GMP_QB_locatorplus_v11_cABD"></gmpx-api-loader>
      <gmpx-store-locator map-id="DEMO_MAP_ID"></gmpx-store-locator>

      <div id="fallback-map">
        <div class="fallback-header">
          <div>
            <div class="fallback-title">Taller de Carrocería y Pintura</div>
            <div class="fallback-address">José Zazueta 16, Col. Los Encinos, Heroica Nogales, Son.</div>
          </div>
          <a class="fallback-btn" href="https://www.google.com/maps/place/Taller+de+Carrocer%C3%ADa+y+Pintura/@31.2988874,-110.9549794,19z/data=!3m1!4b1!4m6!3m5!1s0x86d153005b10bfed:0x3f274fab2f53c6a5!8m2!3d31.2988874!4d-110.9549794!16s%2Fg%2F11zf0m97xm" target="_blank" rel="noopener noreferrer">
            Abrir en Maps ↗
          </a>
        </div>
        <iframe 
          class="map-frame"
          src="https://maps.google.com/maps?q=31.2988874,-110.9549794&z=16&output=embed"
          loading="lazy"
          allowfullscreen
        ></iframe>
      </div>
    </div>
  </body>
</html>
